<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RentMe - User Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .login-container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            padding: 40px;
            width: 100%;
            max-width: 400px;
        }
        
        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .login-header h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 10px;
        }
        
        .login-header p {
            color: #666;
            font-size: 14px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }
        
        .form-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 5px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .login-button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 10px;
        }
        
        .login-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        .login-button:active {
            transform: translateY(0);
        }
        
        .login-button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }
        
        .message {
            padding: 12px;
            border-radius: 5px;
            margin-bottom: 20px;
            display: none;
        }
        
        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .message.show {
            display: block;
        }
        
        .register-link {
            text-align: center;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #e0e0e0;
        }
        
        .register-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
        }
        
        .register-link a:hover {
            text-decoration: underline;
        }
        
        .loading {
            display: none;
            text-align: center;
            margin-top: 10px;
        }
        
        .loading.show {
            display: block;
        }
        
        .profile-info {
            display: none;
            margin-top: 20px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 5px;
        }
        
        .profile-info.show {
            display: block;
        }
        
        .profile-info h3 {
            color: #333;
            margin-bottom: 15px;
        }
        
        .profile-info p {
            color: #666;
            margin-bottom: 8px;
        }
        
        .logout-button {
            width: 100%;
            padding: 10px;
            background: #dc3545;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 14px;
            cursor: pointer;
            margin-top: 15px;
        }
        
        .logout-button:hover {
            background: #c82333;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h1>RentMe</h1>
            <p>User Login</p>
        </div>
        
        <div id="message" class="message"></div>
        
        <div id="loginForm">
            <form id="loginFormElement">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" required placeholder="Enter your email">
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required placeholder="Enter your password">
                </div>
                
                <button type="submit" class="login-button" id="loginButton">
                    Login
                </button>
                
                <div class="loading" id="loading">
                    Logging in...
                </div>
            </form>
            
            <div class="register-link">
                <p>Don't have an account? <a href="/register/">Register here</a></p>
            </div>
        </div>
        
        <div id="profileInfo" class="profile-info">
            <h3>Welcome!</h3>
            <p><strong>Email:</strong> <span id="userEmail"></span></p>
            <p><strong>Username:</strong> <span id="userUsername"></span></p>
            <p><strong>Name:</strong> <span id="userName"></span></p>
            <button class="logout-button" onclick="logout()">Logout</button>
        </div>
    </div>
    
    <script>
        const API_BASE_URL = 'http://localhost:8000/api/users';
        
        // Wait for DOM to be fully loaded
        document.addEventListener('DOMContentLoaded', function() {
            // Check if user is already logged in
            checkLoginStatus();
            
            // Handle form submission
            const loginForm = document.getElementById('loginFormElement');
            if (loginForm) {
                loginForm.addEventListener('submit', async (e) => {
                    e.preventDefault();
                    
                    const email = document.getElementById('email').value;
                    const password = document.getElementById('password').value;
                    
                    if (!email || !password) {
                        showMessage('Please fill in all fields', 'error');
                        return;
                    }
                    
                    await login(email, password);
                });
            }
            
            // Pre-fill test user credentials for easy testing
            const emailInput = document.getElementById('email');
            const passwordInput = document.getElementById('password');
            if (emailInput) emailInput.value = 'testuser@example.com';
            if (passwordInput) passwordInput.value = 'testpass123';
        });
        
        function showMessage(text, type) {
            const messageDiv = document.getElementById('message');
            if (messageDiv) {
                messageDiv.textContent = text;
                messageDiv.className = `message ${type} show`;
                setTimeout(() => {
                    messageDiv.classList.remove('show');
                }, 5000);
            }
        }
        
        function showLoading(show) {
            const loadingDiv = document.getElementById('loading');
            const loginButton = document.getElementById('loginButton');
            if (loadingDiv) loadingDiv.classList.toggle('show', show);
            if (loginButton) loginButton.disabled = show;
        }
        
        // Get CSRF token from cookies
        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }
        
        async function login(email, password) {
            try {
                showLoading(true);
                
                // Get CSRF token
                const csrftoken = getCookie('csrftoken');
                
                const headers = {
                    'Content-Type': 'application/json',
                };
                
                if (csrftoken) {
                    headers['X-CSRFToken'] = csrftoken;
                }
                
                const response = await fetch(`${API_BASE_URL}/login/`, {
                    method: 'POST',
                    headers: headers,
                    credentials: 'include', // Important for cookies
                    body: JSON.stringify({
                        email: email,
                        password: password
                    })
                });
                
                let data;
                try {
                    data = await response.json();
                } catch (e) {
                    data = { detail: 'Invalid response from server' };
                }
                
                if (response.ok) {
                    showMessage('Login successful!', 'success');
                    displayProfile(data.user);
                } else {
                    const errorMsg = data.detail || 
                                   data.non_field_errors?.[0] || 
                                   data.error || 
                                   Object.values(data).flat().join(', ') ||
                                   'Login failed. Please check your credentials.';
                    showMessage(errorMsg, 'error');
                }
            } catch (error) {
                showMessage('Error connecting to server. Make sure the server is running on port 8000.', 'error');
                console.error('Login error:', error);
            } finally {
                showLoading(false);
            }
        }
        
        async function checkLoginStatus() {
            try {
                const response = await fetch(`${API_BASE_URL}/profile/`, {
                    method: 'GET',
                    credentials: 'include'
                });
                
                if (response.ok) {
                    const user = await response.json();
                    displayProfile(user);
                }
            } catch (error) {
                // Not logged in, show login form
                console.log('Not logged in');
            }
        }
        
        function displayProfile(user) {
            const loginForm = document.getElementById('loginForm');
            const profileInfo = document.getElementById('profileInfo');
            
            if (loginForm) loginForm.style.display = 'none';
            if (profileInfo) {
                profileInfo.classList.add('show');
                
                const emailSpan = document.getElementById('userEmail');
                const usernameSpan = document.getElementById('userUsername');
                const nameSpan = document.getElementById('userName');
                
                if (emailSpan) emailSpan.textContent = user.email || '';
                if (usernameSpan) usernameSpan.textContent = user.username || '';
                if (nameSpan) {
                    nameSpan.textContent = user.full_name || 
                                         `${user.first_name || ''} ${user.last_name || ''}`.trim() || 
                                         user.username || '';
                }
            }
        }
        
        async function logout() {
            try {
                const csrftoken = getCookie('csrftoken');
                
                const headers = {};
                if (csrftoken) {
                    headers['X-CSRFToken'] = csrftoken;
                }
                
                const response = await fetch(`${API_BASE_URL}/logout/`, {
                    method: 'POST',
                    headers: headers,
                    credentials: 'include'
                });
                
                if (response.ok) {
                    const profileInfo = document.getElementById('profileInfo');
                    const loginForm = document.getElementById('loginForm');
                    const loginFormElement = document.getElementById('loginFormElement');
                    
                    if (profileInfo) profileInfo.classList.remove('show');
                    if (loginForm) loginForm.style.display = 'block';
                    if (loginFormElement) loginFormElement.reset();
                    
                    showMessage('Logged out successfully!', 'success');
                } else {
                    showMessage('Logout failed. Please try again.', 'error');
                }
            } catch (error) {
                showMessage('Error during logout. Please try again.', 'error');
                console.error('Logout error:', error);
            }
        }
        
        // Make logout function globally accessible
        window.logout = logout;
    </script>
</body>
</html>
